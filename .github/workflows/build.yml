name: Build and Release OS ISO

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-multilib nasm grub-pc-bin grub-common xorriso mtools dos2unix zip

    - name: Ensure Unix line endings and permissions
      run: |
        dos2unix scripts/build_counter.sh || sed -i 's/\r$//' scripts/build_counter.sh
        chmod +x scripts/build_counter.sh

    - name: Build Kernel and ISO
      run: |
        set -o pipefail
        make 2>&1 | tee make.log
        VERSION=$(grep "KERNEL_BUILD" include/version.h | head -1 | cut -d '"' -f 2)
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV
        # Create the source archive as a release asset.
        git archive --format=zip --output="pixel_neko_source_${VERSION}.zip" HEAD

    - name: Step Summary and Diagnostics
      if: always()
      run: |
        if [ -f make.log ]; then
          echo "### Build Log Output" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 150 make.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload Bootable ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pixel-neko-bootable-iso
        path: pixel_neko*.iso
        if-no-files-found: error

    - name: Publish GitHub Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: "Pixel Neko Next ${{ env.TAG_NAME }}"
        body: |
          ## Pixel Neko Next ${{ env.TAG_NAME }}

          ### Release Assets
          - Bootable ISO image: `pixel_neko.iso`
          - Source archive: `pixel_neko_source_${{ env.VERSION }}.zip`
          - Build commit: `${{ github.sha }}`

          ### Running
          - QEMU: `qemu-system-i386 -cdrom pixel_neko.iso -m 128M -boot d`
          - USB input self-test: `qemu-system-i386 -kernel iso/boot/kernel.elf -m 128M -device piix3-usb-uhci -device usb-kbd -device usb-mouse -serial file:usb_log.txt`
          - VirtualBox / VMware: create a 32-bit Other/Unknown virtual machine and boot this ISO.

          ### Highlights (Build 2012.200)
          - **USB 2.0 core**: a shared Host Controller Interface abstraction, standard descriptor parsing and full GET_DESCRIPTOR / SET_ADDRESS / SET_CONFIGURATION enumeration (up to 4 controllers and 8 devices).
          - **UHCI (USB 1.1)**: PCI I/O BAR probing, frame list with QH/TD scheduling, control/interrupt/bulk transfers, two root ports with low/full-speed detection.
          - **EHCI (USB 2.0)**: MMIO capability and operational register setup, qTD transfers and up to eight root ports; 64-bit EHCI is reported as unsupported.
          - **HID boot protocol**: USB keyboards and mice are translated to PS/2 Set-1 scancodes and injected into the existing input pipeline, so USB and PS/2 devices work together (up to 4 HID devices).
          - **Safe fallback and diagnostics**: OHCI/xHCI controllers are detected and logged as unsupported, and enumeration state is written to COM1 as `[USB ]`, `[UHCI]`, `[EHCI]` and `[HID ]` messages.
          - **Build system**: Windows hosts use the `i686-elf-` cross toolchain, the ISO name is fixed to `pixel_neko.iso`, the build counter writes `build/generated/version.h`, and `make run-kernel` / `make run-usb` are available.
          - **Maintained baseline**: VMware SVGA II 2D acceleration with VBE/Mach64 fallback, Intel/VMware HDAudio and VIA VT1708S routing (including the 2012.104 BDL fix), CMI8738 and CT4810/ES1371 audio, FAT12/16/32 + ISO9660 VFS, and PS/2 IRQ input with polling fallback.
          - Full 3D rendering and OHCI/xHCI support are not part of this release.
        draft: false
        prerelease: false
        files: |
          pixel_neko*.iso
          pixel_neko_source_*.zip

name: Build and Release OS ISO

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-multilib nasm grub-pc-bin grub-common xorriso mtools dos2unix zip

    - name: Ensure Unix line endings and permissions
      run: |
        dos2unix scripts/build_counter.sh || sed -i 's/\r$//' scripts/build_counter.sh
        chmod +x scripts/build_counter.sh

    - name: Build Kernel and ISO
      run: |
        set -o pipefail
        make 2>&1 | tee make.log
        VERSION=$(grep "KERNEL_BUILD" include/version.h | head -1 | cut -d '"' -f 2)
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV
        # Create the source archive as a release asset.
        git archive --format=zip --output="pixel_neko_source_${VERSION}.zip" HEAD

    - name: Step Summary and Diagnostics
      if: always()
      run: |
        if [ -f make.log ]; then
          echo "### Build Log Output" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 150 make.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload Bootable ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pixel-neko-bootable-iso
        path: pixel_neko*.iso
        if-no-files-found: error

    - name: Publish GitHub Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: "Pixel Neko Next ${{ env.TAG_NAME }}"
        body: |
          ## Pixel Neko Next ${{ env.TAG_NAME }}

          ### Release Assets
          - Bootable ISO image: `pixel_neko_build_${{ env.VERSION }}.iso`
          - Source archive: `pixel_neko_source_${{ env.VERSION }}.zip`
          - Build commit: `${{ github.sha }}`

          ### Running
          - QEMU: `qemu-system-i386 -cdrom pixel_neko_build_${{ env.VERSION }}.iso -m 128M -boot d`
          - VirtualBox / VMware: create a 32-bit Other/Unknown virtual machine and boot this ISO.

          ### Highlights
          - P0 kernel foundation: PCI/BAR management, shared IRQ dispatch, DMA/MMIO helpers, serial ring logging and prioritized driver registration.
          - P1 VMware SVGA II: 32bpp modes, FIFO 2D fill/copy/update, dirty-rectangle presentation, hardware cursor and safe VBE/linear-framebuffer fallback.
          - PIT, PS/2 keyboard and PS/2 mouse now use hardware IRQs; CMI8738 and CT4810/ES1371 DMA buffers use the common DMA allocator.
          - Existing ATI Mach64, CT4810/ES1371, CMI8738 and standard VBE fallback paths remain available.
          - SVGA 3D-capable VMware profiles are accepted for 2D acceleration; full 3D rendering is not part of this release.
          - Build 2012.001 fixes stalled SVGA presentation and frozen PS/2 input by using software-cursor and polling fallbacks.
          - Build 2012.100 adds Intel/VMware HDAudio, VIA VT1708S routing, 44.1/48kHz streams and explicit SVGA 3D-capable 2D compatibility.
          - Build 2012.101 fixes hidden PCI devices in System Information and adds exact VMware 15AD:1977 HDAudio probing with detailed fallback status.
        draft: false
        prerelease: false
        files: |
          pixel_neko*.iso
          pixel_neko_source_*.zip
